<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Money</title>
<style>
:root{--logo:#0f5132;--g:#16a34a;--r:#e5484d;--ink:#111;--mut:#6b7280;--line:#ececec;--soft:#f5f6f5;--bg:#fff;--card:#fff;--onink:#fff;--tab:#3c3c43;--tabbg:rgba(244,246,245,.55);--tabbd:rgba(255,255,255,.75);--tabon:#0f7a37;--selbg:#eef7f1;--glass:rgba(255,255,255,.6);--glassbd:rgba(255,255,255,.75);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none}
main{max-width:720px;margin:0 auto;padding:34px max(16px,env(safe-area-inset-right)) 128px max(16px,env(safe-area-inset-left))}
[hidden]{display:none!important}
h2{font-size:18px;margin:22px 0 6px}
small{color:var(--mut)}
.inc{color:var(--g)}.exp{color:var(--r)}
.bal{border:1px solid var(--line);border-radius:18px;padding:20px 16px 10px;text-align:center}
.bal>small{font-size:14px}
.bal>b{display:block;font-size:38px;letter-spacing:-1px;margin:2px 0}
.bal .sub{color:var(--mut);font-size:14px}
.bal .sub b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.btn{border:0;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer}
.btn.g{background:var(--g)}.btn.k{background:var(--ink);color:var(--onink)}.btn.wide{width:100%;margin-top:12px}
.lnk{background:none;border:0;color:var(--g);font:inherit;font-weight:600;cursor:pointer;padding:8px}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd h2{margin:18px 0 0}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
.ib{border:0;background:none;color:#aaa;font-size:17px;cursor:pointer;padding:4px 6px}
.ok{border:1.5px solid var(--g);color:var(--g);background:var(--card);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.late{color:var(--r)}
.day{font-size:13px;font-weight:700;color:var(--mut);margin:16px 0 0;text-transform:uppercase;letter-spacing:.4px}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:420px;display:flex;gap:2px;padding:5px;border-radius:32px;background:var(--tabbg);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--tabbd);box-shadow:0 10px 32px rgba(0,0,0,.16),0 1px 0 rgba(255,255,255,.95) inset,0 -1px 0 rgba(0,0,0,.05) inset;z-index:10}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tabbar{background:rgba(250,250,250,.96)}}
.tabbar button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 2px 7px;font:inherit;font-size:11px;font-weight:600;color:var(--tab);border-radius:27px;cursor:pointer;transition:color .3s,transform .15s}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--tabon)}
.tabbar button.on svg{animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
.tabbar button:active{transform:scale(.94)}
.ind{position:absolute;left:0;top:5px;bottom:5px;width:0;border-radius:27px;background:rgba(22,163,74,.16);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px rgba(22,163,74,.12) inset,0 4px 12px rgba(22,163,74,.14);will-change:transform;pointer-events:none}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>section{animation:fi .32s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sum div{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center}
.sum small{display:block;font-size:12px}.sum b{font-size:15px}
.chart{border:1px solid var(--line);border-radius:14px;padding:6px}
.chart svg{width:100%;height:auto;display:block}
.tl{font-size:9px;fill:var(--mut);text-anchor:middle}
.det{background:var(--soft);border-radius:14px;padding:4px 14px;margin-top:10px}
.det h3{font-size:15px;margin:10px 0 0}
.det .row:last-child{border-bottom:0}
.cat{font-size:14px;margin:10px 0}
.cat>div:first-child{display:flex;justify-content:space-between}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.bar i.inc{background:var(--g)}.bar i.exp{background:var(--r)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20;overflow:hidden;animation:ovIn .25s ease-out}
.ov .sheet{animation:sheetUp .4s cubic-bezier(.2,.9,.25,1)}
.ov.out{animation:ovOut .26s ease-in forwards;pointer-events:none}
.ov.out .sheet{animation:sheetDown .26s ease-in forwards}
@keyframes ovIn{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,.4)}}
@keyframes ovOut{from{background:rgba(0,0,0,.4)}to{background:rgba(0,0,0,0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
.sheet{background:var(--card);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:19px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:10px;border-radius:10px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--ink)}
.chips[data-grp],.seg[data-grp]{position:relative}
.gi{position:absolute;left:0;top:0;z-index:0;pointer-events:none;will-change:transform;margin:0}
.chips[data-grp] .chip{position:relative;z-index:1}
.chips[data-grp] .chip.on{background:transparent;border-color:transparent;color:var(--onink)}
.chips[data-grp] .gi{background:var(--ink);border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.seg[data-grp] button{position:relative;z-index:1}
.seg[data-grp] button.on{background:transparent;box-shadow:none}
.ver{text-align:center;font-size:12px;color:var(--mut);opacity:.7;margin-top:20px}
.seg.s3{grid-template-columns:1fr 1fr 1fr}.seg.s3 button{padding:10px 4px;font-size:14px}
.seg[data-grp] .gi{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sheet input[type=number]{width:100%;font:inherit;font-size:30px;font-weight:700;border:0;border-bottom:2px solid var(--ink);padding:6px 0;outline:0;background:var(--card);color:var(--ink)}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=time],.sheet select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--card);color:var(--ink)}
.sheet input[type=date],.sheet input[type=time],.sheet select{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
.sheet input[type=date]::-webkit-date-and-time-value,.sheet input[type=time]::-webkit-date-and-time-value{min-width:0;text-align:left;margin:0}
.sheet input[type=date]::-webkit-datetime-edit,.sheet input[type=time]::-webkit-datetime-edit{padding:0;min-width:0}
.sheet input[type=date]::-webkit-calendar-picker-indicator,.sheet input[type=time]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--mut);font-size:14px}
.hint{color:var(--mut);font-size:14px}
@media (max-width:380px){.bal>b{font-size:31px}.sum b{font-size:13px}.sum div{padding:9px 4px}.tabbar{width:calc(100% - 20px)}.tabbar button{font-size:10px}.tabbar svg{width:20px;height:20px}.btn{font-size:16px;padding:13px}h2{font-size:17px}}
@media (min-width:430px){.bal>b{font-size:42px}}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 10%,#145c3e 0%,#0b3b28 45%,#05201a 100%);pointer-events:none;animation:spOut 2.3s linear forwards}
.sp-w0{position:relative;width:200px;height:180px;animation:spEnter .4s ease-out both}
.sp-shake{width:100%;height:100%;transform-origin:50% 70%;animation:spShake .4s .4s ease-in-out both}
.sp-settle{width:100%;height:100%;animation:spSettle .4s 1.2s ease-in-out both}
.sp-art{width:200px;height:180px;display:block;overflow:visible;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.sp-cardA{animation:spCard .4s .8s ease-out both}
.sp-cardB{animation:spCard .35s .85s ease-out both}
.sp-name{margin-top:14px;color:#f4f7f2;font:600 30px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.3px;opacity:0;animation:spText .4s 1.6s ease-out both}
.sp-brand{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:#6fd49a;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:2px}
@keyframes spEnter{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes spShake{0%{transform:rotate(0)}25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
@keyframes spSettle{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.01)}100%{transform:translateY(0) scale(1)}}
@keyframes spCard{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:translateY(0)}}
@keyframes spText{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spOut{0%,87%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@keyframes spOutR{0%,50%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation:spOutR .6s linear forwards}#splash *{animation:none!important}.sp-name{opacity:1}}

.setbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px 9px 11px;border-radius:22px;border:1px solid var(--tabbd);background:var(--tabbg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.1),0 1px 0 rgba(255,255,255,.6) inset;transition:transform .15s}

.bub::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 70% at 12% 0%,rgba(255,255,255,.5),transparent 55%);opacity:.5;pointer-events:none}
.bub>*{position:relative}

.fi{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
